services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-classifier-api:latest
    container_name: image-classifier-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - shared-images:/data/images
    command: ["baseline"]
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: image-classifier-ui:latest
    container_name: image-classifier-ui
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
      SHARED_IMAGE_DIR: /data/images
    volumes:
      - shared-images:/data/images
    depends_on:
      - api
    restart: unless-stopped

volumes:
  shared-images:
